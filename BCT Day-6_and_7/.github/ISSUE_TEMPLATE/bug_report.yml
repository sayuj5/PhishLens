name: "🐛 Bug Report"
description: "Report a bug or unexpected behaviour in BlackFalcon."
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I click X, the expected Y happens but instead Z happens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide clear steps to reproduce the behaviour."
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behaviour"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python version, Node version, browser."
      placeholder: |
        - OS: Windows 11
        - Python: 3.12.1
        - Node: 20.x
        - Browser: Chrome 126
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs"
      description: "Paste any relevant backend or browser console output here."
      render: shell

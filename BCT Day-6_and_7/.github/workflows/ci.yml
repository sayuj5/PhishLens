name: BlackFalcon CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Backend Tests & Lint
  # ─────────────────────────────────────────────────────────
  backend:
    name: Backend – Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest-cov

      - name: Lint with ruff
        run: pip install ruff && ruff check backend/ --select=E,W,F --ignore=E501

      - name: Run backend tests with coverage
        run: |
          pytest backend/ \
            -v \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --ignore=backend/venv \
            -x
        env:
          SECRET_KEY: test-secret-key-ci
          DATABASE_URL: sqlite:///./test.db
          FRONTEND_URL: http://localhost:3000

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────
  # Frontend Tests & Type Check
  # ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend – Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (verify it compiles)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─────────────────────────────────────────────────────────
  # Docker Build Smoke Test
  # ─────────────────────────────────────────────────────────
  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t blackfalcon-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t blackfalcon-frontend:ci ./frontend

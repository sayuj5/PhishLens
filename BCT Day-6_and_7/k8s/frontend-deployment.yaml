apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackfalcon-frontend
  labels:
    app: blackfalcon
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackfalcon
      tier: frontend
  template:
    metadata:
      labels:
        app: blackfalcon
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: blackfalcon/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: blackfalcon-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackfalcon-frontend-svc
spec:
  type: LoadBalancer
  selector:
    app: blackfalcon
    tier: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
